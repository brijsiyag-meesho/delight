[package]
name = "delight-ui"
description = "Delight's own UI kit — theme palettes, widgets, text editor, icons. Used only by the app; plugins get the theme and text fields through delight-sdk's Host."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
delight-sdk.workspace = true
# GPUI comes from the shared delight-sdk dylib, never linked directly.
gpui = { package = "delight-gpui", path = "../gpui-alias" }
image.workspace = true
log.workspace = true
resvg.workspace = true
smallvec.workspace = true
unicode-segmentation.workspace = true
