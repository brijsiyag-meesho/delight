[package]
name = "delight-sdk"
description = "The Delight plugin SDK: tool schema, GPUI re-export and host API. Built as a dylib shared by the app and plugins."
# The SDK is versioned on its own, not with the app: plugins bind to one SDK
# build, so this changes only in an SDK release (a new GPUI, rustc, Cargo.lock
# or public API) — app-only releases keep every installed plugin working.
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
# One shared copy of GPUI (and of this crate) for the app and every plugin.
crate-type = ["dylib"]

[dependencies]
gpui.workspace = true
regex.workspace = true
serde_json.workspace = true

# Not used by the SDK itself: every third-party crate of the workspace, with the
# same features, so Cargo's feature resolution — and therefore this dylib — is
# identical whichever packages a build selects (app alone, a plugin alone, the
# whole workspace). A plugin built separately then matches the app's SDK.
# Keep in sync with [workspace.dependencies].
anyhow.workspace = true
base64.workspace = true
dirs.workspace = true
env_logger.workspace = true
futures.workspace = true
global-hotkey.workspace = true
hmac.workspace = true
image.workspace = true
libloading.workspace = true
log.workspace = true
plist.workspace = true
resvg.workspace = true
serde.workspace = true
sha2.workspace = true
shlex.workspace = true
smallvec.workspace = true
yaml-rust2.workspace = true
tray-icon.workspace = true
unicode-segmentation.workspace = true
raw-window-handle.workspace = true

[build-dependencies]
rustc_version.workspace = true
walkdir.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
security-framework.workspace = true
