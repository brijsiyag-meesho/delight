[package]
name = "delight"
description = "Spotlight-style developer utility launcher for macOS, built on GPUI."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "delight"
path = "src/main.rs"

[dependencies]
delight-sdk.workspace = true
delight-core.workspace = true
anyhow.workspace = true
global-hotkey.workspace = true
# GPUI comes from the shared delight-sdk dylib, never linked directly.
gpui = { package = "delight-gpui", path = "../gpui-alias" }
log.workspace = true
tray-icon.workspace = true
unicode-segmentation.workspace = true
raw-window-handle.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc.workspace = true
cocoa.workspace = true
