[package]
name = "delight"
description = "Spotlight-style developer toolbox for macOS, built on GPUI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# `delight` is the plugin CLI (crates/cli).
[[bin]]
name = "delight-app"
path = "src/main.rs"

[dependencies]
delight-sdk.workspace = true
delight-core.workspace = true
delight-ui.workspace = true
delight-tools.workspace = true
delight-plugin-manager.workspace = true
anyhow.workspace = true
askama.workspace = true
dirs.workspace = true
env_logger.workspace = true
futures.workspace = true
global-hotkey.workspace = true
# GPUI comes from the shared delight-sdk dylib, never linked directly.
gpui = { package = "delight-gpui", path = "../gpui-alias" }
log.workspace = true
notify.workspace = true
plist.workspace = true
raw-window-handle.workspace = true
resvg.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_lenient.workspace = true
tray-icon.workspace = true

[build-dependencies]
# Embedding the SDK kit (build.rs).
walkdir.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-uniform-type-identifiers.workspace = true
