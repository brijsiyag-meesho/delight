[workspace]
resolver = "2"
members = [
    "crates/sdk",
    "crates/gpui-alias",
    "crates/ui",
    "crates/core",
    "crates/tools",
    "crates/plugin-manager",
    "crates/app",
]
# The `delight` CLI is its own workspace: a standalone binary, without the
# shared-std setup of the app and plugins (see crates/cli/.cargo).
exclude = ["crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# All versions pinned exactly (supply-chain policy).
[workspace.dependencies]
delight-sdk = { path = "crates/sdk" }
delight-gpui = { path = "crates/gpui-alias" }
delight-core = { path = "crates/core" }
delight-ui = { path = "crates/ui" }
delight-tools = { path = "crates/tools" }
delight-plugin-manager = { path = "crates/plugin-manager" }
anyhow = "=1.0.100"
# Text templates, compiled and checked at build time (the agent report in Settings).
askama = { version = "=0.16.1", default-features = false, features = ["derive", "std"] }
base64 = "=0.22.1"
dirs = "=5.0.1"
# Without the `regex` feature: module filters only.
env_logger = { version = "=0.11.8", default-features = false, features = ["auto-color", "humantime"] }
futures = "=0.3.34"
global-hotkey = "=0.8.0"
gpui = "=0.2.2"
hmac = "=0.12.1"
# The versions GPUI links, for rasterising tool logos (see delight-ui badge).
image = { version = "=0.25.10", default-features = false }
libloading = "=0.8.9"
log = "=0.4.33"
# Watching keymap.json, as Zed does.
notify = "=8.2.0"
plist = "=1.10.1"
regex = "=1.11.3"
rustc_version = "=0.4.1"
resvg = { version = "=0.45.1", default-features = false }
security-framework = "=3.7.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["preserve_order"] }
# JSON with comments and trailing commas (keymap files), as in Zed.
serde_json_lenient = "=0.2.4"
shlex = "=1.3.0"
sha2 = "=0.10.9"
smallvec = "=1.16.1"
tray-icon = "=0.25.1"
# Syntax highlighting for built-in tools (delight-ui), as in Zed.
# Reading and editing plugin repos' Cargo.toml (delight-plugin-manager).
toml_edit = "=0.25.15"
tree-sitter = "=0.25.10"
tree-sitter-highlight = "=0.25.10"
tree-sitter-json = "=0.24.8"
tree-sitter-yaml = "=0.7.2"
unicode-segmentation = "=1.13.3"
walkdir = "=2.5.0"
yaml-rust2 = { version = "=0.13.0", default-features = false }
# The versions tray-icon links.
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", features = [
    "NSAnimation", "NSAppearance", "NSApplication", "NSBezierPath", "NSColor", "NSEvent", "NSGlassEffectView", "NSGraphics", "NSImage", "NSPasteboard", "NSPasteboardItem", "NSResponder",
    "NSRunningApplication", "NSView", "NSWorkspace", "NSVisualEffectView", "NSWindow", "objc2-quartz-core",
] }
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSData", "NSGeometry", "NSString", "NSURL", "objc2-core-foundation"] }
# What kind of file a copied file is, from its extension.
objc2-uniform-type-identifiers = { version = "=0.3.2", default-features = false, features = ["std", "UTCoreTypes", "UTType"] }
raw-window-handle = "=0.6.2"

# No LTO: it can't be combined with the shared libdelight_sdk.dylib.
[profile.release]
codegen-units = 1
strip = true

# The SDK kit: a plugin's crates.io dependency on the SDK resolves to this
# workspace's copy, so it gets the exact build identity the app was built with.
[patch.crates-io]
delight-sdk = { path = "crates/sdk" }
delight-gpui = { path = "crates/gpui-alias" }
